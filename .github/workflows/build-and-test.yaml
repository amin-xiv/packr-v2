        uses: actions/download-artifact@v4
        with:
          name: build-directory-release-gcc
          path: build

      - name: set execution permissions
        run: bash -c "$CHMOD_CMD"
        working-directory: build

      - name: Setup tests - debug
        run: bash ../scripts/tests-setup.sh
        working-directory: build

      - run: ls && ls -R && tree
        working-directory: build

      - name: run tests
        run: ctest  --output-on-failure
        working-directory: build

