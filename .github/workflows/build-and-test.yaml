name: on-push-actions
run-name: Build and test

on: [push]

env:
  # To set executable permissions after downloading the build artifacts
  CHMOD_CMD: >
    pwd && ls -R &&
    chmod +x
    ./packr
    ./tests/main_tests

jobs:
  build-debug-gcc:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - run: mkdir build

      - name: Update gcc
        run: |
          sudo apt update
          sudo apt install -y g++-14

      - name: Configure CMake
        run: |
            cmake -S .. -B . \
              -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_C_COMPILER=gcc-14 \
              -DCMAKE_CXX_COMPILER=g++-14
        working-directory: build

      - name: Build executables
        run: cmake --build . --parallel 8
        working-directory: build


      - name: Upload build directory
        uses: actions/upload-artifact@v4
        with:
          name: build-directory-debug-gcc
          path: ./build

  test-debug-gcc:
      needs: build-debug-gcc

      runs-on: ubuntu-latest

      steps:
      - uses: actions/checkout@v6

      - run: mkdir build

      - name: Download build directory
        uses: actions/download-artifact@v4
        with:
          name: build-directory-debug-gcc
          path: build

      - name: set execution permissions
        run: bash -c "$CHMOD_CMD"
        working-directory: build

      - name: Setup tests - debug
        run: bash ../scripts/tests-setup.sh
        working-directory: build

      - run: ls && ls -R && tree
        working-directory: build

      - name: run tests
        run: ctest  --output-on-failure
        working-directory: build

  build-release-gcc:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - run: mkdir build

      - run: |
          sudo apt update
          sudo apt install -y g++-14

      - name: Configure CMake
        run: |
            cmake -S .. -B . \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER=gcc-14 \
              -DCMAKE_CXX_COMPILER=g++-14
        working-directory: build

      - name: Build executables
        run: cmake --build . --parallel 8
        working-directory: build


      - name: Upload build directory
        uses: actions/upload-artifact@v4
        with:
          name: build-directory-release-gcc
          path: ./build

  test-release-gcc:
      needs: build-release-gcc

      runs-on: ubuntu-latest

      steps:
      - uses: actions/checkout@v6

      - run: mkdir build

      - name: Download build directory
        uses: actions/download-artifact@v4
        with:
          name: build-directory-release-gcc
          path: build

      - name: set execution permissions
        run: bash -c "$CHMOD_CMD"
        working-directory: build

      - name: Setup tests - debug
        run: bash ../scripts/tests-setup.sh
        working-directory: build

      - run: ls && ls -R && tree
        working-directory: build

      - name: run tests
        run: ctest  --output-on-failure
        working-directory: build

  build-debug-clang:
